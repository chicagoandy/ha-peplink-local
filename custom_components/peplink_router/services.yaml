join_wifi:
  target:
    entity:
      integration: peplink_router
      domain: select
  fields:
    password:
      required: false
      selector:
        text:
          type: password
    ssid:
      required: false
      example: CampgroundWiFi
      selector:
        text:

forget_wifi:
  target:
    entity:
      integration: peplink_router
      domain: select
  fields:
    ssid:
      required: false
      example: CampgroundWiFi
      selector:
        text:

set_health_check:
  target:
    entity:
      integration: peplink_router
      domain: switch
  fields:
    retries:
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box
    timeout:
      required: false
      example: 4
      selector:
        number:
          min: 1
          max: 60
          step: 0.5
          unit_of_measurement: s
          mode: box
    interval:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
          mode: box
    recovery_retries:
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box
